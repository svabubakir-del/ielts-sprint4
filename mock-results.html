<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IELTS Sprint4 &#8212; Mock Exam Results</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f7f8fa;color:#1a1a1a;min-height:100vh;}

/* ── header ── */
.header{background:#fff;border-bottom:1px solid #e2e4e8;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.brand{font-weight:800;font-size:18px;}.brand span{color:#0F5C6B;}
.teacher-info{display:flex;align-items:center;gap:12px;}
.teacher-name{font-size:14px;font-weight:700;color:#475569;}
.back-btn{color:#0F5C6B;text-decoration:none;font-weight:700;font-size:14px;border:1px solid #0F5C6B;border-radius:7px;padding:7px 14px;}
.back-btn:hover{background:#e6eef0;}

/* ── main layout ── */
.main{max-width:1200px;margin:0 auto;padding:28px 24px;}
.page-title{font-size:26px;font-weight:800;margin-bottom:6px;}
.page-sub{color:#6b7280;font-size:14px;margin-bottom:24px;}

/* ── filter bar ── */
.filter-bar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
.filter-bar label{font-size:13px;font-weight:700;color:#475569;}
.filter-bar select{font:inherit;font-size:14px;padding:8px 12px;border:1px solid #e2e4e8;border-radius:7px;background:#fff;cursor:pointer;}
.search-input{font:inherit;font-size:14px;padding:8px 12px;border:1px solid #e2e4e8;border-radius:7px;background:#fff;width:220px;}
.search-input:focus{outline:none;border-color:#0F5C6B;}
.count-badge{margin-left:auto;font-size:13px;color:#6b7280;font-weight:600;}

/* ── student cards grid ── */
.students-grid{display:flex;flex-direction:column;gap:16px;}
.student-card{background:#fff;border:1px solid #e2e4e8;border-radius:12px;overflow:hidden;}
.student-card-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;user-select:none;}
.student-card-header:hover{background:#f7f8fa;}
.student-info{display:flex;align-items:center;gap:14px;}
.student-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#0F5C6B,#6366f1);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;flex-shrink:0;}
.student-name{font-weight:700;font-size:16px;}
.student-meta{font-size:12px;color:#6b7280;margin-top:2px;}
.score-pills{display:flex;gap:8px;flex-wrap:wrap;}
.pill{border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;white-space:nowrap;}
.pill.listen{background:#dbeafe;color:#1e40af;}
.pill.read{background:#dcfce7;color:#166534;}
.pill.write{background:#fef3c7;color:#92400e;}
.pill.pending{background:#f1f5f9;color:#94a3b8;}
.expand-icon{font-size:18px;color:#94a3b8;transition:transform .2s;margin-left:12px;flex-shrink:0;}
.expand-icon.open{transform:rotate(180deg);}

/* ── expanded detail ── */
.student-detail{display:none;border-top:1px solid #e2e4e8;padding:20px;}
.student-detail.show{display:block;}
.detail-tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:2px solid #e2e4e8;padding-bottom:0;}
.detail-tab{padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;color:#6b7280;}
.detail-tab.active{color:#0F5C6B;border-bottom-color:#0F5C6B;}
.tab-pane{display:none;}.tab-pane.active{display:block;}

/* ── score overview ── */
.score-overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px;}
.score-box{background:#f7f8fa;border:1px solid #e2e4e8;border-radius:10px;padding:14px;text-align:center;}
.score-box .label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;margin-bottom:6px;}
.score-box .value{font-size:28px;font-weight:800;color:#0F5C6B;}
.score-box .band{font-size:13px;color:#6b7280;margin-top:2px;}

/* ── answer table ── */
.answer-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.answer-table th{background:#f0f4f5;font-weight:700;padding:9px 12px;text-align:left;border-bottom:2px solid #e2e4e8;}
.answer-table td{padding:8px 12px;border-bottom:1px solid #f0f2f4;vertical-align:top;}
.answer-table tr:last-child td{border-bottom:none;}
.correct-cell{color:#1f9d55;font-weight:700;}
.wrong-cell{color:#d23a3a;font-weight:700;}
.ans-key{color:#6b7280;font-size:12px;}

/* ── writing section ── */
.essay-box{background:#f7f8fa;border:1px solid #e2e4e8;border-radius:8px;padding:16px;font-size:14.5px;line-height:1.8;white-space:pre-wrap;max-height:400px;overflow-y:auto;font-family:Georgia,serif;color:#1a1a1a;}
.feedback-area{margin-top:16px;}
.feedback-label{font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;display:block;}
.feedback-textarea{width:100%;font:inherit;font-size:14px;padding:12px;border:1px solid #e2e4e8;border-radius:8px;resize:vertical;min-height:100px;line-height:1.6;}
.feedback-textarea:focus{outline:none;border-color:#0F5C6B;}
.band-row{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap;}
.band-select{font:inherit;font-size:14px;padding:8px 12px;border:1px solid #e2e4e8;border-radius:7px;background:#fff;}
.save-feedback-btn{background:#0F5C6B;color:#fff;border:none;border-radius:7px;padding:9px 20px;font-size:14px;font-weight:700;cursor:pointer;}
.save-feedback-btn:hover{background:#0c4a57;}
.save-feedback-btn.saved{background:#1f9d55;}
.word-badge{display:inline-block;background:#e6eef0;color:#0F5C6B;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;margin-bottom:10px;}

/* ── empty states ── */
.empty{text-align:center;padding:60px 20px;color:#94a3b8;}
.empty h3{font-size:20px;margin-bottom:8px;color:#475569;}
.loading{text-align:center;padding:40px;color:#6b7280;}
.loading .spinner{width:32px;height:32px;border:3px solid #e2e4e8;border-top-color:#0F5C6B;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}
.error-box{background:#fbeaea;border:1px solid #f5c6cb;border-radius:8px;padding:14px 18px;color:#d23a3a;font-size:14px;margin-bottom:16px;}

/* ── responsive ── */
@media(max-width:600px){.score-pills{display:none;}.filter-bar{gap:8px;}}
</style>
</head>
<body>

<div class="header">
  <div class="brand">IELTS <span>Sprint4</span> &#8212; Mock Results</div>
  <div class="teacher-info">
    <span class="teacher-name" id="teacherNameDisplay"></span>
    <a href="teacher-dashboard.html" class="back-btn">&#8592; Dashboard</a>
  </div>
</div>

<div class="main">
  <div class="page-title">&#127775; Mock Exam Results</div>
  <div class="page-sub" id="pageSubTitle">Loading your students&#39; mock exam results&#8230;</div>

  <div id="errorBox" class="error-box" style="display:none;"></div>

  <div class="filter-bar" id="filterBar" style="display:none;">
    <label>Group:</label>
    <select id="groupFilter" onchange="applyFilters()">
      <option value="">All groups</option>
    </select>
    <input class="search-input" id="searchInput" placeholder="Search student name&#8230;" oninput="applyFilters()">
    <span class="count-badge" id="countBadge"></span>
  </div>

  <div id="loadingState" class="loading">
    <div class="spinner"></div>
    <div>Loading results&#8230;</div>
  </div>

  <div class="students-grid" id="studentsGrid"></div>

  <div id="emptyState" class="empty" style="display:none;">
    <h3>No mock exam results yet</h3>
    <p>Results will appear here once students complete the mock exam on Sunday.</p>
  </div>
</div>

<script src="../supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
"use strict";

var LISTENING_KEY = {
  'q1': ['central'],'q2': ['address'],'q3': ['pool'],'q4': ['reception'],'q5': ['view'],
  'q6': ['price', 'prices'],'q7': ['spanish'],'q8': ['july'],'q9': ['903036602'],'q10': ['cliffton'],
  'q11': 'A','q12': 'C','q13': 'C','q14': 'B','q15': 'C','q16': 'F','q17': 'B','q18': 'A','q19': 'E','q20': 'D',
  'q21': 'C','q22': 'A','q23': 'A','q24': 'A','q25': 'E','q26': 'G','q27': 'C','q28': 'A','q29': 'B','q30': 'H',
  'q31': ['temperature'],'q32': ['movements'],'q33': ['bones'],'q34': ['bushes'],'q35': ['roots'],
  'q36': ['sharks'],'q37': ['chicks'],'q38': ['feathers'],'q39': ['space', 'spaces'],'q40': ['diversity']
};
var READING_KEY = {
  '1': 'FALSE','2': 'NOT GIVEN','3': 'TRUE','4': 'FALSE','5': 'NOT GIVEN','6': 'FALSE',
  '7': 'His diaries','8': '3/Three years','9': 'Chains','10': 'Governor Philip','11': 'June 1789','12': 'China','13': 'Botany Bay',
  '14': 'A','15': 'D','16': 'B','17': 'D','18': 'C','19': 'B','20': 'D','21': 'A',
  '22': 'workplace injury','23': '16.6 weeks','24': '7%','25': 'golf','26': 'massage',
  '27': 'C','28': 'D','29': 'B','30': 'A','31': 'D','32': 'C',
  '33': 'marketing teams','34': 'external designers','35': 'consumers','36': 'in-house designers','37': 'design engineers',
  '38': 'B','39': 'B','40': 'A'
};

function checkIsCorrect(studentAns, correctAns){
  if(studentAns === undefined || studentAns === null || String(studentAns).trim()==='') return null; // not answered
  var sa = String(studentAns).trim().toLowerCase();
  if(Array.isArray(correctAns)){
    return correctAns.some(function(c){ return String(c).trim().toLowerCase() === sa; });
  }
  return String(correctAns).trim().toLowerCase() === sa;
}

// ── AUTH ────────────────────────────────────────────────────────────────────
var session = null;
try {
  var raw = sessionStorage.getItem('sprint4_session');
  if(raw) session = JSON.parse(raw);
} catch(e){}

if(!session || (session.role !== 'teacher' && session.role !== 'mentor' && session.role !== 'admin')){
  // try teacher password fallback
  window.location.href = 'teacher-dashboard.html';
  return;
}

document.getElementById('teacherNameDisplay').textContent =
  session.name || session.username || (session.role === 'admin' ? 'Admin' : 'Teacher');

// ── SUPABASE ────────────────────────────────────────────────────────────────
var sb = null;
function getSB(){
  if(!sb && window.supabase && typeof SUPABASE_URL !== "undefined")
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return sb;
}

// ── STATE ───────────────────────────────────────────────────────────────────
var allExams = [];     // raw mock_exams rows
var allStudents = {};  // id -> {name, group_id, group_name}
var myStudentIds = []; // filtered to this teacher's students
var groupMap = {};     // group_id -> group_name

// ── LOAD DATA ────────────────────────────────────────────────────────────────
async function loadAll(){
  var db = getSB();
  if(!db){ showError('Could not connect to database.'); return; }

  try {
    // 1. Get this mentor/teacher's groups
    var myGroupIds = [];
    if(session.role !== 'admin'){
      var mgRes = await db.from('mentor_groups')
        .select('group_id')
        .eq('mentor_id', session.id);
      if(!mgRes.error && mgRes.data){
        myGroupIds = mgRes.data.map(function(r){ return r.group_id; });
      }
      // also try teacher_id on groups table directly (fallback)
      if(myGroupIds.length === 0){
        var tgRes = await db.from('groups')
          .select('id')
          .eq('teacher_id', session.id);
        if(!tgRes.error && tgRes.data){
          myGroupIds = tgRes.data.map(function(r){ return r.id; });
        }
      }
    }

    // 2. Get all groups for filter dropdown
    var grpRes = await db.from('groups').select('id, name');
    if(!grpRes.error && grpRes.data){
      grpRes.data.forEach(function(g){ groupMap[g.id] = g.name; });
    }

    // 3. Get students (filtered to this teacher's groups or all if admin)
    var studQuery = db.from('students').select('id, full_name, group_id');
    if(session.role !== 'admin' && myGroupIds.length > 0){
      studQuery = studQuery.in('group_id', myGroupIds);
    }
    var studRes = await studQuery;
    if(studRes.error) throw studRes.error;

    (studRes.data || []).forEach(function(s){
      allStudents[s.id] = {
        name: s.full_name || 'Student',
        group_id: s.group_id,
        group_name: groupMap[s.group_id] || 'Unassigned'
      };
      myStudentIds.push(s.id);
    });

    // 4. Get mock_exams for these students
    var examQuery = db.from('mock_exams').select('*').order('submitted_at', {ascending: false});
    if(session.role !== 'admin' && myStudentIds.length > 0){
      examQuery = examQuery.in('student_id', myStudentIds);
    } else if(session.role !== 'admin' && myStudentIds.length === 0){
      // no students assigned — show empty
      showEmpty('No students are assigned to your groups yet.');
      return;
    }
    var examRes = await examQuery;
    if(examRes.error) throw examRes.error;

    allExams = examRes.data || [];

    // 5. Populate group filter
    populateGroupFilter();

    // 6. Render
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('filterBar').style.display = 'flex';
    applyFilters();

    var examDate = allExams.length > 0 ? (allExams[0].exam_date || '') : '';
    document.getElementById('pageSubTitle').textContent =
      allExams.length + ' result' + (allExams.length !== 1 ? 's' : '') +
      (examDate ? ' — Exam date: ' + examDate : '') +
      ' — ' + Object.keys(allStudents).length + ' student' +
      (Object.keys(allStudents).length !== 1 ? 's' : '') + ' in your groups';

  } catch(err){
    console.error(err);
    showError('Error loading results: ' + (err.message || JSON.stringify(err)));
  }
}

function populateGroupFilter(){
  var sel = document.getElementById('groupFilter');
  var usedGroups = {};
  Object.values(allStudents).forEach(function(s){
    if(s.group_id && !usedGroups[s.group_id]){
      usedGroups[s.group_id] = s.group_name;
    }
  });
  Object.entries(usedGroups).forEach(function(kv){
    var opt = document.createElement('option');
    opt.value = kv[0];
    opt.textContent = kv[1];
    sel.appendChild(opt);
  });
}

// ── FILTER ───────────────────────────────────────────────────────────────────
function applyFilters(){
  var groupFilter = document.getElementById('groupFilter').value;
  var search = document.getElementById('searchInput').value.toLowerCase().trim();

  // group exams by student, most recent per student
  var byStudent = {};
  allExams.forEach(function(exam){
    if(!byStudent[exam.student_id]) byStudent[exam.student_id] = exam;
  });

  // also include students with NO exam yet
  myStudentIds.forEach(function(sid){
    if(!byStudent[sid]) byStudent[sid] = null;
  });

  var filtered = Object.entries(byStudent).filter(function(kv){
    var sid = kv[0];
    var info = allStudents[sid] || {};
    if(groupFilter && info.group_id !== groupFilter) return false;
    if(search && !(info.name || '').toLowerCase().includes(search)) return false;
    return true;
  });

  // sort: exams first, then pending
  filtered.sort(function(a, b){
    var aHas = a[1] !== null ? 1 : 0;
    var bHas = b[1] !== null ? 1 : 0;
    if(bHas !== aHas) return bHas - aHas;
    var aName = (allStudents[a[0]] || {}).name || '';
    var bName = (allStudents[b[0]] || {}).name || '';
    return aName.localeCompare(bName);
  });

  document.getElementById('countBadge').textContent = filtered.length + ' students';

  var grid = document.getElementById('studentsGrid');
  grid.innerHTML = '';
  if(filtered.length === 0){
    showEmpty(); return;
  }
  document.getElementById('emptyState').style.display = 'none';

  filtered.forEach(function(kv){
    var sid = kv[0];
    var exam = kv[1];
    var info = allStudents[sid] || {name: 'Student', group_name: ''};
    grid.appendChild(buildCard(sid, info, exam));
  });
}

// ── BUILD CARD ────────────────────────────────────────────────────────────────
function buildCard(sid, info, exam){
  var el = document.createElement('div');
  el.className = 'student-card';
  el.dataset.sid = sid;

  var initials = (info.name || 'S').split(' ').map(function(w){ return w[0]; }).join('').slice(0,2).toUpperCase();
  var examDate = exam ? (exam.exam_date || exam.submitted_at || '').slice(0,10) : '';

  var pillsHtml = '';
  if(exam){
    var ls = exam.listening_score !== null ? exam.listening_score + '/40' : '?/40';
    var lb = exam.listening_band ? ' B' + exam.listening_band : '';
    var rs = exam.reading_score !== null ? exam.reading_score + '/40' : '?/40';
    var rb = exam.reading_band ? ' B' + exam.reading_band : '';
    var wt1 = exam.writing_t1_words || 0;
    var wt2 = exam.writing_t2_words || 0;
    var sentBadge = exam.results_published ? '<span class="pill" style="background:#e6f6ec;color:#1f9d55;">&#10003; Sent</span>' : '<span class="pill" style="background:#fef3c7;color:#92400e;">&#9203; Pending review</span>';
    pillsHtml = '<div class="score-pills">' +
      '<span class="pill listen">&#127911; L: ' + ls + lb + '</span>' +
      '<span class="pill read">&#128214; R: ' + rs + rb + '</span>' +
      '<span class="pill write">&#9999;&#65039; W: T1:' + wt1 + 'w T2:' + wt2 + 'w</span>' +
      sentBadge +
      '</div>';
  } else {
    pillsHtml = '<div class="score-pills"><span class="pill pending">Not submitted</span></div>';
  }

  el.innerHTML =
    '<div class="student-card-header" onclick="toggleCard(\'' + sid + '\')">' +
      '<div class="student-info">' +
        '<div class="student-avatar">' + initials + '</div>' +
        '<div>' +
          '<div class="student-name">' + esc(info.name) + '</div>' +
          '<div class="student-meta">' + esc(info.group_name) + (examDate ? ' &nbsp;&bull;&nbsp; Exam: ' + examDate : ' &nbsp;&bull;&nbsp; No exam yet') + '</div>' +
        '</div>' +
      '</div>' +
      pillsHtml +
      '<div class="expand-icon" id="icon-' + sid + '">&#9660;</div>' +
    '</div>' +
    '<div class="student-detail" id="detail-' + sid + '">' +
      (exam ? buildDetail(sid, exam) : '<p style="color:#94a3b8;padding:8px 0;">This student has not completed the mock exam yet.</p>') +
    '</div>';

  return el;
}

function buildDetail(sid, exam){
  var liScore = exam.listening_score !== null ? exam.listening_score : '&#8212;';
  var rScore  = exam.reading_score   !== null ? exam.reading_score   : '&#8212;';

  // Score overview boxes
  var overview = '<div class="score-overview">' +
    '<div class="score-box"><div class="label">Listening</div><div class="value">' + liScore + '<small style="font-size:16px;">/40</small></div>' +
      '<div class="band">' + (exam.listening_band ? 'Band ' + exam.listening_band : '') + '</div></div>' +
    '<div class="score-box"><div class="label">Reading</div><div class="value">' + rScore + '<small style="font-size:16px;">/40</small></div>' +
      '<div class="band">' + (exam.reading_band ? 'Band ' + exam.reading_band : '') + '</div></div>' +
    '<div class="score-box"><div class="label">Writing T1</div><div class="value" style="font-size:18px;">' + (exam.writing_t1_words || 0) + '</div><div class="band">words</div></div>' +
    '<div class="score-box"><div class="label">Writing T2</div><div class="value" style="font-size:18px;">' + (exam.writing_t2_words || 0) + '</div><div class="band">words</div></div>' +
  '</div>';

  // Tabs
  var tabs = '<div class="detail-tabs">' +
    '<div class="detail-tab active" onclick="switchTab(\'' + sid + '\',\'listening\',this)">&#127911; Listening Answers</div>' +
    '<div class="detail-tab" onclick="switchTab(\'' + sid + '\',\'reading\',this)">&#128214; Reading Answers</div>' +
    '<div class="detail-tab" onclick="switchTab(\'' + sid + '\',\'writing\',this)">&#9999;&#65039; Writing Essays</div>' +
    '<div class="detail-tab" onclick="switchTab(\'' + sid + '\',\'speaking\',this)">&#127908; Speaking</div>' +
  '</div>';

  // Listening answers pane
  var liAnswers = exam.listening_answers || {};
  var liRows = '';
  for(var i=1;i<=40;i++){
    var key = 'q'+i;
    var rawAns = liAnswers[String(i)];
    var hasAns = rawAns !== undefined && rawAns !== null && String(rawAns).trim() !== '';
    var ans = hasAns ? String(rawAns) : 'N/A';
    var correct = LISTENING_KEY[key];
    var isCorrect = hasAns ? checkIsCorrect(rawAns, correct) : null;
    var cellClass = isCorrect === true ? 'correct-cell' : isCorrect === false ? 'wrong-cell' : '';
    var correctDisplay = Array.isArray(correct) ? correct[0] : correct;
    liRows += '<tr><td style="color:#6b7280;font-weight:700;">' + i + '</td>' +
      '<td class="' + cellClass + '">' + esc(ans) + (isCorrect===true?' &#10003;':isCorrect===false?' &#10007;':'') + '</td>' +
      '<td class="ans-key">' + (isCorrect===false ? esc(String(correctDisplay)) : '') + '</td></tr>';
  }
  var liPane = '<div class="tab-pane active" id="pane-' + sid + '-listening">' +
    '<table class="answer-table"><thead><tr><th>#</th><th>Student Answer</th><th>Correct Answer</th></tr></thead><tbody>' + liRows + '</tbody></table>' +
  '</div>';

  // Reading answers pane
  var rAnswers = exam.reading_answers || {};
  var rRows = '';
  for(var j=1;j<=40;j++){
    var rkey = String(j);
    var rawRAns = rAnswers[rkey];
    var hasRAns = rawRAns !== undefined && rawRAns !== null && String(rawRAns).trim() !== '';
    var rans = hasRAns ? String(rawRAns) : 'N/A';
    var rCorrect = READING_KEY[rkey];
    var rIsCorrect = hasRAns ? checkIsCorrect(rawRAns, rCorrect) : null;
    var rCellClass = rIsCorrect === true ? 'correct-cell' : rIsCorrect === false ? 'wrong-cell' : '';
    rRows += '<tr><td style="color:#6b7280;font-weight:700;">' + j + '</td>' +
      '<td class="' + rCellClass + '">' + esc(rans) + (rIsCorrect===true?' &#10003;':rIsCorrect===false?' &#10007;':'') + '</td>' +
      '<td class="ans-key">' + (rIsCorrect===false ? esc(String(rCorrect)) : '') + '</td></tr>';
  }
  var rPane = '<div class="tab-pane" id="pane-' + sid + '-reading">' +
    '<table class="answer-table"><thead><tr><th>#</th><th>Student Answer</th><th>Correct Answer</th></tr></thead><tbody>' + rRows + '</tbody></table>' +
  '</div>';

  // Writing pane
  var examId = exam.id;
  var t1text = exam.writing_t1_text || '';
  var t2text = exam.writing_t2_text || '';
  var wPane = '<div class="tab-pane" id="pane-' + sid + '-writing">' +

    '<h4 style="margin-bottom:8px;color:#0F5C6B;">Task 1 &#8212; Chart Description</h4>' +
    '<span class="word-badge">' + (exam.writing_t1_words || 0) + ' words</span>' +
    '<div class="essay-box">' + esc(t1text || '(not submitted)') + '</div>' +
    '<div class="feedback-area">' +
      '<label class="feedback-label">Feedback for Task 1:</label>' +
      '<textarea class="feedback-textarea" id="fb-t1-' + sid + '" placeholder="Write your feedback here&#8230;">' + esc(exam.t1_feedback || '') + '</textarea>' +
      '<div class="band-row">' +
        '<label style="font-size:13px;font-weight:700;">Band:</label>' +
        '<select class="band-select" id="band-t1-' + sid + '">' + bandOptions(exam.t1_band) + '</select>' +
        '<button class="save-feedback-btn" id="savebtn-t1-' + sid + '" onclick="saveFeedback(\'' + examId + '\',\'' + sid + '\',\'t1\')">Save Feedback</button>' +
      '</div>' +
    '</div>' +

    '<hr style="border:none;border-top:1px solid #e2e4e8;margin:22px 0;">' +

    '<h4 style="margin-bottom:8px;color:#0F5C6B;">Task 2 &#8212; Essay</h4>' +
    '<span class="word-badge">' + (exam.writing_t2_words || 0) + ' words</span>' +
    '<div class="essay-box">' + esc(t2text || '(not submitted)') + '</div>' +
    '<div class="feedback-area">' +
      '<label class="feedback-label">Feedback for Task 2:</label>' +
      '<textarea class="feedback-textarea" id="fb-t2-' + sid + '" placeholder="Write your feedback here&#8230;">' + esc(exam.t2_feedback || '') + '</textarea>' +
      '<div class="band-row">' +
        '<label style="font-size:13px;font-weight:700;">Band:</label>' +
        '<select class="band-select" id="band-t2-' + sid + '">' + bandOptions(exam.t2_band) + '</select>' +
        '<button class="save-feedback-btn" id="savebtn-t2-' + sid + '" onclick="saveFeedback(\'' + examId + '\',\'' + sid + '\',\'t2\')">Save Feedback</button>' +
      '</div>' +
    '</div>' +
  '</div>';

  // Speaking pane (no recording — manual band + feedback entry)
  var sPane = '<div class="tab-pane" id="pane-' + sid + '-speaking">' +
    '<div style="background:#f7f8fa;border:1px solid #e2e4e8;border-radius:8px;padding:16px;margin-bottom:16px;font-size:13.5px;color:#6b7280;">' +
      '&#8505;&#65039; The platform does not record speaking. Conduct the speaking test separately with this student, then enter their band score and feedback below.' +
    '</div>' +
    '<div class="feedback-area" style="margin-top:0;">' +
      '<label class="feedback-label">Feedback for Speaking:</label>' +
      '<textarea class="feedback-textarea" id="fb-speaking-' + sid + '" placeholder="Write your feedback here&#8230;">' + esc(exam.speaking_feedback || '') + '</textarea>' +
      '<div class="band-row">' +
        '<label style="font-size:13px;font-weight:700;">Band:</label>' +
        '<select class="band-select" id="band-speaking-' + sid + '">' + bandOptions(exam.speaking_band) + '</select>' +
        '<button class="save-feedback-btn" id="savebtn-speaking-' + sid + '" onclick="saveFeedback(\'' + examId + '\',\'' + sid + '\',\'speaking\')">Save Feedback</button>' +
      '</div>' +
    '</div>' +
  '</div>';

  // Send Results section
  var isPublished = !!exam.results_published;
  var sendSection = '<div style="margin-top:24px;padding-top:20px;border-top:2px solid #e2e4e8;">';
  if(isPublished){
    sendSection += '<div style="background:#e6f6ec;border:1px solid #6ee7b7;border-radius:8px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">' +
      '<span style="color:#1f9d55;font-weight:700;font-size:14px;">&#10003; Results sent to student</span>' +
      '<button class="save-feedback-btn" style="background:#fff;color:#0F5C6B;border:1px solid #0F5C6B;" onclick="sendResults(\'' + examId + '\',\'' + sid + '\')">Re-send / Update</button>' +
    '</div>';
  } else {
    sendSection += '<button class="save-feedback-btn" style="background:#1f9d55;padding:12px 24px;font-size:15px;" onclick="sendResults(\'' + examId + '\',\'' + sid + '\')">&#128228; Send Results to Student</button>' +
    '<p style="font-size:12.5px;color:#94a3b8;margin-top:8px;">The student will not see any scores or feedback until you click this button.</p>';
  }
  sendSection += '</div>';

  return overview + tabs + liPane + rPane + wPane + sPane + sendSection;
}

function bandOptions(selected){
  var bands = ['','5.0','5.5','6.0','6.5','7.0','7.5','8.0','8.5','9.0'];
  return bands.map(function(b){
    return '<option value="' + b + '"' + (b === String(selected || '') ? ' selected' : '') + '>' + (b || '&#8212; Select band') + '</option>';
  }).join('');
}

// ── INTERACTIONS ──────────────────────────────────────────────────────────────
function toggleCard(sid){
  var detail = document.getElementById('detail-' + sid);
  var icon = document.getElementById('icon-' + sid);
  if(!detail || !icon) return;
  var isOpen = detail.classList.contains('show');
  detail.classList.toggle('show', !isOpen);
  icon.classList.toggle('open', !isOpen);
}
window.toggleCard = toggleCard;

function switchTab(sid, tabName, el){
  // deactivate all tabs and panes for this card
  var card = el.closest('.student-card');
  card.querySelectorAll('.detail-tab').forEach(function(t){t.classList.remove('active');});
  card.querySelectorAll('.tab-pane').forEach(function(p){p.classList.remove('active');});
  el.classList.add('active');
  var pane = document.getElementById('pane-' + sid + '-' + tabName);
  if(pane) pane.classList.add('active');
}
window.switchTab = switchTab;

// ── SAVE FEEDBACK ─────────────────────────────────────────────────────────────
async function saveFeedback(examId, sid, task){
  var db = getSB(); if(!db) return;
  var fbEl   = document.getElementById('fb-' + task + '-' + sid);
  var bandEl = document.getElementById('band-' + task + '-' + sid);
  var btnEl  = document.getElementById('savebtn-' + task + '-' + sid);
  if(!fbEl || !bandEl || !btnEl) return;

  var patch = {};
  patch[task + '_feedback'] = fbEl.value;
  patch[task + '_band']     = bandEl.value || null;

  btnEl.textContent = 'Saving&#8230;';
  btnEl.disabled = true;

  try {
    var res = await db.from('mock_exams').update(patch).eq('id', examId);
    if(res.error) throw res.error;
    btnEl.textContent = 'Saved &#10003;';
    btnEl.className = 'save-feedback-btn saved';
    setTimeout(function(){
      btnEl.textContent = 'Save Feedback';
      btnEl.className = 'save-feedback-btn';
      btnEl.disabled = false;
    }, 2500);
  } catch(err){
    alert('Save failed: ' + (err.message || JSON.stringify(err)));
    btnEl.textContent = 'Save Feedback';
    btnEl.disabled = false;
  }
}
window.saveFeedback = saveFeedback;

// ── SEND RESULTS TO STUDENT ────────────────────────────────────────────────
async function sendResults(examId, sid){
  var info = allStudents[sid] || {};
  var msg = 'Send results to ' + (info.name || 'this student') + '? They will immediately be able to see their scores, essays, and your feedback.';
  if(!confirm(msg)) return;

  var db = getSB(); if(!db) return;
  try {
    var res = await db.from('mock_exams').update({
      results_published: true,
      results_published_at: new Date().toISOString()
    }).eq('id', examId);
    if(res.error) throw res.error;
    // refresh this card's data
    var examIdx = allExams.findIndex(function(e){ return e.id === examId; });
    if(examIdx >= 0){
      allExams[examIdx].results_published = true;
    }
    applyFilters();
    // re-expand the card so mentor sees updated state
    setTimeout(function(){
      var card = document.querySelector('.student-card[data-sid="' + sid + '"]');
      if(card){
        toggleCard(sid);
        card.scrollIntoView({behavior:'smooth', block:'center'});
      }
    }, 100);
  } catch(err){
    alert('Failed to send results: ' + (err.message || JSON.stringify(err)));
  }
}
window.sendResults = sendResults;

// ── HELPERS ───────────────────────────────────────────────────────────────────
function esc(str){
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showError(msg){
  document.getElementById('loadingState').style.display = 'none';
  var box = document.getElementById('errorBox');
  box.textContent = msg;
  box.style.display = 'block';
}
function showEmpty(msg){
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('emptyState').style.display = 'block';
  if(msg) document.getElementById('emptyState').querySelector('p').textContent = msg;
}

// ── DEEP LINK: auto-expand a specific student ────────────────────────────────
function autoExpandFromURL(){
  var params = new URLSearchParams(window.location.search);
  var targetId = params.get('student');
  if(!targetId) return;
  setTimeout(function(){
    var card = document.querySelector('.student-card[data-sid="' + targetId + '"]');
    if(card){
      toggleCard(targetId);
      card.scrollIntoView({behavior:'smooth', block:'start'});
      card.style.boxShadow = '0 0 0 2px #0F5C6B';
    }
  }, 400);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
(function waitSdk(){
  if(window.supabase) loadAll().then(autoExpandFromURL);
  else setTimeout(waitSdk, 100);
})();

})();
</script>
